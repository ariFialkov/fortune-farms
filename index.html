<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Fortune Farms</title>
  <meta name="description" content="Fortune Farms — a 3D farm of fortune. Roll the harvest, run the farm." />
  <meta name="theme-color" content="#5cc93f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fortune Farms" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui">
    <div id="vignette"></div>
    <div id="tags"></div>
    <div id="labels"></div>
    <div id="popups"></div>
    <header id="topbar"></header>
    <div id="roundbar" hidden></div>
    <div id="title"></div>
    <button id="ff" hidden><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 5.5v13a1 1 0 0 0 1.6.8L12 13.6v4.9a1 1 0 0 0 1.6.8l8-6.5a1 1 0 0 0 0-1.6l-8-6.5A1 1 0 0 0 12 5.5v4.9L4.6 4.7A1 1 0 0 0 3 5.5z"/></svg><span>2× SPEED</span></button>
    <footer id="hud"></footer>
    <div id="banner"></div>
    <div id="confetti"></div>
    <div id="modal" hidden></div>
    <div id="toast"></div>
  </div>
  <div id="splash"><div class="logo big">Fortune<span>Farms</span></div><div class="loading">Planting seeds…</div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
